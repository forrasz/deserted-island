schema: spec-driven

# Project context
context: |
  無人島から脱出する横スクロール・アクションプラットフォーマー(個人学習用、ローカル実行のみ)。
  脱出条件: イカダの部品をすべて集めて完成させ、海へ出ること。
  技術: TypeScript(strict) + HTML5 Canvas + Vite、テストは Vitest、パッケージ管理は npm。
  ゲームエンジンは使わず、固定タイムステップ(60FPS)のループを自作している。
  ゲームロジック(物理・当たり判定・アイテム・イカダ完成条件・クリア判定)は
  Canvas / DOM に依存しない純粋な TypeScript(src/core)で実装し、
  描画と入力は薄いアダプタ(src/platform)に留める。
  アセットは当面、図形によるプレースホルダーを使う。
  サーバ・オンライン機能・外部サービスは持たない。
  すべての成果物(proposal, specs, design, tasks)は日本語で書く。

# Per-artifact rules
rules:
  specs:
    - 各 Scenario は Vitest で検証できる粒度で、Given/When/Then 形式で書く
  tasks:
    - ロジック層のタスクには対応する Vitest テストを含める


# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
